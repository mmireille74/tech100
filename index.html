<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>TECH100 v22</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e1014;color:#e8e8ea;font:15px/1.4 system-ui,-apple-system,sans-serif;padding:10px 10px 70px}
.card{background:#171a21;border:1px solid #262b36;border-radius:12px;padding:12px;margin-bottom:10px}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#7d8695;margin:0 0 9px;font-weight:600}
label{display:block;font-size:12px;color:#8b93a1;margin:8px 0 4px}
input,select{width:100%;background:#0e1014;border:1px solid #2d3442;border-radius:8px;color:#e8e8ea;padding:11px;font:15px system-ui;font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:none;border-color:#4a7dff}
button{background:#232936;border:1px solid #333b4a;color:#e8e8ea;border-radius:9px;padding:12px;font:600 14px system-ui;width:100%;cursor:pointer}
button:active{transform:scale(.985)}
.pri{background:#1d4ed8;border-color:#1d4ed8}
.dan{background:#b91c1c;border-color:#b91c1c}
.ok{background:#15803d;border-color:#15803d}
.row{display:flex;gap:8px}.row>*{flex:1}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#4b5563;flex:none}
.dot.live{background:#22c55e;box-shadow:0 0 8px #22c55e}
.dot.slow{background:#eab308}.dot.dead{background:#ef4444}
#stat{font-size:12px;color:#8b93a1;flex:1}
#px{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
#px.old{color:#f59e0b}
#age{font-size:11px;color:#6b7280;margin-top:5px}
#banner{display:none;border-radius:10px;padding:14px;margin-bottom:10px;text-align:center;font-weight:700;font-size:16px}
#banner.on{display:block;animation:bl .55s steps(1) infinite}
#banner.red{background:#b91c1c}
#banner.blue{background:#1d4ed8}
@keyframes bl{50%{opacity:.55}}
#banner small{display:block;font-weight:400;font-size:12px;opacity:.92;margin-top:5px}
.lvl{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #232936;font-variant-numeric:tabular-nums;font-size:14px}
.lvl:last-child{border:0}
.lvl b{color:#9aa4b2;font-weight:600;font-size:12px}
.lvl .v{font-weight:600}
.res{color:#f87171}.sup{color:#4ade80}
table.sig{width:100%;font-size:14px;border-collapse:collapse}
table.sig td{padding:5px 0;font-variant-numeric:tabular-nums}
table.sig td:first-child{color:#8b93a1;font-size:12px;width:46%}
.big{font-size:20px;font-weight:700}
.jr{font-size:12px;border-bottom:1px solid #232936;padding:7px 0;font-variant-numeric:tabular-nums}
.jr:last-child{border:0}
.warn{background:#3f2d0a;border:1px solid #78500f;color:#fbbf24;padding:8px;border-radius:8px;font-size:12px;margin-top:8px}
.bad{background:#3f0d0d;border:1px solid #7f1d1d;color:#f87171;padding:8px;border-radius:8px;font-size:12px;margin-top:8px}
.mini{font-size:11px;color:#6b7280;margin-top:6px}
.lock{background:#3f0d0d;border:1px solid #7f1d1d;color:#f87171;padding:10px;border-radius:8px;font-size:13px;text-align:center;font-weight:600}
</style>
</head>
<body>

<div class="hdr">
  <div class="dot" id="dot"></div>
  <div id="stat">neconectat</div>
  <div style="font-size:11px;color:#4b5563">v22</div>
</div>

<div id="banner"><span id="btxt"></span><small id="bsub"></small></div>

<div class="card">
  <div id="px">—</div>
  <div id="age">preț: —</div>
  <div class="row" style="margin-top:10px">
    <button onclick="toggleFeed()" id="fb">Conectează</button>
    <button onclick="openS()">Setări</button>
  </div>
</div>

<div class="card" id="set" style="display:none">
  <h2>Setări</h2>
  <label>Cheie Finnhub</label>
  <input id="key" placeholder="cheia">
  <label>Capital $</label>
  <input id="cap" type="number" inputmode="decimal">
  <label>Lot</label>
  <input id="lot" type="number" inputmode="decimal" step="0.01">
  <label>Distanță stop (puncte)</label>
  <input id="stp" type="number" inputmode="decimal">
  <div class="mini" id="risktxt"></div>
  <label style="margin-top:14px">Pivot R2</label>
  <input id="pR2" type="number" inputmode="decimal">
  <label>Pivot R1</label>
  <input id="pR1" type="number" inputmode="decimal">
  <label>Pivot P</label>
  <input id="pP" type="number" inputmode="decimal">
  <label>Pivot S1</label>
  <input id="pS1" type="number" inputmode="decimal">
  <label>Pivot S2</label>
  <input id="pS2" type="number" inputmode="decimal">
  <div class="mini" id="pivtxt"></div>
  <button onclick="saveS()" class="ok" style="margin-top:12px">Salvează</button>
  <button onclick="closeS()" style="margin-top:8px">Închide</button>
</div>

<div class="card">
  <h2>Baza CFD</h2>
  <div id="basistxt" class="mini">bază: —</div>
  <label>Preț CFD real acum</label>
  <input id="cfd" type="number" inputmode="decimal" placeholder="ex. 25150">
  <button onclick="setBasis()" class="pri" style="margin-top:8px">Setează baza</button>
</div>

<div class="card">
  <h2>Niveluri</h2>
  <div id="lvls"><div class="mini">introdu pivoții în Setări</div></div>
</div>

<div class="card">
  <h2>Armare</h2>
  <div id="lockbox"></div>
  <label>Long peste</label>
  <select id="armL"></select>
  <button onclick="arm('L')" id="btnL" style="margin-top:8px">Armează long</button>
  <label style="margin-top:10px">Short sub</label>
  <select id="armS"></select>
  <button onclick="arm('S')" id="btnS" style="margin-top:8px">Armează short</button>
  <div class="mini" id="cnttxt"></div>
</div>

<div class="card">
  <h2>Semnal</h2>
  <div id="sig"><div class="mini">niciun semnal</div></div>
</div>

<div class="card">
  <h2>Jurnal <span id="stats" style="color:#6b7280;font-weight:400;text-transform:none;letter-spacing:0"></span></h2>
  <div id="jr"></div>
  <div class="row" style="margin-top:10px">
    <button onclick="closeSig('win')" class="ok">Win</button>
    <button onclick="closeSig('loss')" class="dan">Loss</button>
  </div>
  <button onclick="clearJ()" style="margin-top:8px">Golește jurnalul</button>
</div>

<script>
var FACT=41.37, K='t100_v22', s={}, ws=null, idx=null, prevIdx=null, lastT=0,
    basis=null, basisT=0, A={L:null,S:null}, sig=null, strikes=0, jr=[], trades=0, dayKey='',
    alarm=null, ctx=null, timers=[], wsFail=0, restT=null, beDone=false;

function g(id){return document.getElementById(id)}
function n(v,d){v=parseFloat(v);return isNaN(v)?d:v}
function today(){return new Date().toISOString().slice(0,10)}

function load(){
  try{s=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){s={}}
  g('key').value=s.key||'dc0d679r01qs4ks41jbgdc0d679r01qs4ks41jc0';
  g('cap').value=s.cap||4393; g('lot').value=s.lot||0.1; g('stp').value=s.stp||200;
  g('pR2').value=s.pR2||''; g('pR1').value=s.pR1||''; g('pP').value=s.pP||''; g('pS1').value=s.pS1||''; g('pS2').value=s.pS2||'';
  jr=s.jr||[]; basis=s.basis||null; basisT=s.basisT||0; strikes=s.strikes||0;
  dayKey=s.dayKey||today(); trades=s.trades||0;
  if(dayKey!==today()){dayKey=today();trades=0;strikes=0}
  buildSel(); paint(); renderJ(); riskTxt();
  if(g('key').value) toggleFeed();
}
function save(){s.key=g('key').value.trim();s.cap=n(g('cap').value,4393);s.lot=n(g('lot').value,0.1);
  s.stp=n(g('stp').value,200);s.pR2=n(g('pR2').value,0);s.pR1=n(g('pR1').value,0);
  s.pP=n(g('pP').value,0);s.pS1=n(g('pS1').value,0);s.pS2=n(g('pS2').value,0);
  s.jr=jr;s.basis=basis;s.basisT=basisT;s.strikes=strikes;s.trades=trades;s.dayKey=dayKey;
  localStorage.setItem(K,JSON.stringify(s))}
function saveS(){save();buildSel();paint();riskTxt();closeS()}
function openS(){g('set').style.display='block';riskTxt()}
function closeS(){g('set').style.display='none'}
function riskTxt(){
  var lot=n(g('lot').value,0), st=n(g('stp').value,0), cap=n(g('cap').value,0);
  if(!lot||!st||!cap){g('risktxt').textContent='';return}
  var r=lot*st;
  g('risktxt').textContent='Risc: '+r.toFixed(2)+' $ ('+(r/cap*100).toFixed(2)+'% din cont)';
  g('risktxt').style.color = r/cap>0.02?'#f87171':r/cap>0.012?'#fbbf24':'#6b7280';
}

function piv(){var o={};
  ['R2','R1','P','S1','S2'].forEach(function(k){o[k]=n(g('p'+k).value,0)});
  if(!o.R2||!o.R1||!o.P||!o.S1||!o.S2)return null; return o}
function buildSel(){
  var p=piv(),opts='';
  if(p)['R2','R1','P','S1','S2'].forEach(function(k){opts+='<option value="'+k+'">'+k+'</option>'});
  g('armL').innerHTML=opts; g('armS').innerHTML=opts;
  if(p){g('armL').value='R1';g('armS').value='S1'}
}

function toggleFeed(){
  if(ws){killFeed();return}
  var k=g('key').value.trim();
  if(!k){openS();return}
  save(); beDone=false;
  try{
    ws=new WebSocket('wss://ws.finnhub.io?token='+k);
    ws.onopen=function(){wsFail=0;ws.send(JSON.stringify({type:'subscribe',symbol:'QQQ'}));
      g('stat').textContent='LIVE';g('fb').textContent='Deconectează';if(restT){clearInterval(restT);restT=null}};
    ws.onmessage=function(e){
      var m=JSON.parse(e.data);
      if(m.type!=='trade'||!m.data)return;
      for(var i=0;i<m.data.length;i++)if(m.data[i].s==='QQQ')tick(m.data[i].p*FACT);
    };
    ws.onerror=function(){wsFail++;g('stat').textContent='eroare'};
    ws.onclose=function(){ws=null;g('fb').textContent='Conectează';g('stat').textContent='deconectat';
      g('dot').className='dot';startRest()};
  }catch(e){g('stat').textContent='WS blocat';startRest()}
}
function killFeed(){if(ws){ws.close();ws=null}g('fb').textContent='Conectează';g('stat').textContent='oprit';
  g('dot').className='dot';if(restT){clearInterval(restT);restT=null}}
function startRest(){
  if(restT)return;
  restT=setInterval(function(){
    if(ws)return;
    var k=g('key').value.trim(); if(!k)return;
    fetch('https://finnhub.io/api/v1/quote?symbol=QQQ&token='+k)
      .then(function(r){return r.json()})
      .then(function(d){if(d&&d.c)tick(d.c*FACT)})
      .catch(function(){g('stat').textContent='flux mort'});
  },15000);
}

function tick(v){
  prevIdx=idx; idx=v; lastT=Date.now();
  g('dot').className='dot live'; g('stat').textContent='LIVE';
  paint(); check(); checkBE();
}
function age(){
  if(!lastT){g('age').textContent='preț: —';return}
  var a=Math.floor((Date.now()-lastT)/1000);
  g('age').textContent='preț: acum '+a+'s';
  if(a>60){g('dot').className='dot dead';g('px').className='old'}
  else if(a>20){g('dot').className='dot slow';g('px').className='old'}
  else{g('dot').className='dot live';g('px').className=''}
  paintBasis();
}
function cfdOf(i){return basis===null?null:i+basis}

function paint(){
  if(idx!==null){var c=cfdOf(idx); g('px').textContent=c===null?'—':c.toFixed(2)}
  else g('px').textContent='—';
  paintBasis(); paintLvls(); paintSig(); lockBox();
}
function paintBasis(){
  if(basis===null){g('basistxt').textContent='bază: nesetată';g('basistxt').style.color='#f87171';return}
  var m=Math.floor((Date.now()-basisT)/60000);
  g('basistxt').textContent='bază: '+(basis>0?'+':'')+basis.toFixed(2)+' · acum '+m+' min';
  g('basistxt').style.color = m>40?'#f87171':m>20?'#fbbf24':'#6b7280';
}
function setBasis(){
  var c=n(g('cfd').value,0);
  if(!c){alert('introdu prețul CFD');return}
  if(idx===null){alert('fără preț de la flux');return}
  basis=c-idx; basisT=Date.now(); save(); paint(); g('cfd').value='';
}
function paintLvls(){
  var p=piv();
  if(!p){g('lvls').innerHTML='<div class="mini">introdu pivoții în Setări</div>';return}
  var h='';
  [['R2','res'],['R1','res'],['P',''],['S1','sup'],['S2','sup']].forEach(function(x){
    var v=p[x[0]], cf=basis===null?v:v+basis;
    h+='<div class="lvl"><b class="'+x[1]+'">'+x[0]+'</b><span class="v '+x[1]+'">'+cf.toFixed(2)+'</span></div>';
  });
  g('lvls').innerHTML=h;
}

function lockBox(){
  var lk='';
  if(strikes>=2)lk='<div class="lock">2 strike-uri — gata pe zi</div>';
  else if(trades>=2)lk='<div class="lock">2 intrări atinse — gata pe zi</div>';
  g('lockbox').innerHTML=lk;
  g('cnttxt').textContent='Intrări azi: '+trades+'/2 · Strike: '+strikes+'/2';
}

function arm(side){
  if(strikes>=2||trades>=2){alert('limita zilei atinsă');return}
  var p=piv(); if(!p){alert('pivoții întâi');return}
  if(idx===null){alert('fără preț');return}
  if(A[side]){A[side]=null;g('btn'+side).textContent='Armează '+(side==='L'?'long':'short');g('btn'+side).className='';return}
  var k=side==='L'?g('armL').value:g('armS').value;
  A[side]={lv:k,px:p[k]};
  g('btn'+side).textContent='ARMAT '+(side==='L'?'peste ':'sub ')+k;
  g('btn'+side).className='pri';
}

function check(){
  if(idx===null||prevIdx===null)return;
  ['L','S'].forEach(function(sd){
    var a=A[sd]; if(!a)return;
    if(sd==='L'&&prevIdx<=a.px&&idx>a.px)fire('long',a.lv);
    if(sd==='S'&&prevIdx>=a.px&&idx<a.px)fire('short',a.lv);
  });
}
function fire(dir,lv){
  A.L=null;A.S=null;
  g('btnL').textContent='Armează long';g('btnL').className='';g('btnS').textContent='Armează short';g('btnS').className='';
  var entry=cfdOf(idx); if(entry===null)entry=idx;
  sig={dir:dir,lv:lv,entry:entry,t:Date.now()};
  trades++; beDone=false; save(); lockBox();
  g('banner').className='on red';
  g('btxt').textContent=(dir==='long'?'LONG peste ':'SHORT sub ')+lv+' @ '+entry.toFixed(2);
  g('bsub').textContent='ATINGERE — apasă ca să oprești';
  g('banner').onclick=stopRing;
  ring(dir==='long'?880:660,dir==='long'?1180:440,420);
  try{navigator.vibrate([300,150,300,150,600])}catch(e){}
  try{if(window.Notification&&Notification.permission==='granted')
    new Notification('TECH100 '+dir.toUpperCase()+' '+lv,{body:'atingere @ '+entry.toFixed(2)})}catch(e){}
  paintSig();
}

function checkBE(){
  if(!sig||beDone)return;
  var d=n(g('stp').value,200), dir=sig.dir==='long'?1:-1;
  var c=cfdOf(idx); if(c===null)return;
  var gain=(c-sig.entry)*dir;
  if(gain>=d){
    beDone=true; sig.be=true;
    g('banner').className='on blue';
    g('btxt').textContent='1R atins — mută stopul la break-even';
    g('bsub').textContent='și închide jumătate. Apasă ca să oprești.';
    g('banner').onclick=stopRing;
    ring(1200,900,300);
    try{navigator.vibrate([200,100,200,100,200])}catch(e){}
  }
}

function ring(f1,f2,per){
  stopRing();
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(), gn=ctx.createGain();
    o.type='square'; o.frequency.value=f1; o.connect(gn); gn.connect(ctx.destination); gn.gain.value=.16; o.start();
    var st=setInterval(function(){
      try{o.frequency.setValueAtTime(f1,ctx.currentTime);o.frequency.setValueAtTime(f2,ctx.currentTime+.12)}catch(e){}
    },per);
    alarm={o:o,st:st};
  }catch(e){}
}
function stopRing(){
  if(alarm){try{alarm.o.stop();clearInterval(alarm.st)}catch(e){}alarm=null}
  g('banner').className=''; try{navigator.vibrate(0)}catch(e){}
}

function paintSig(){
  if(!sig){g('sig').innerHTML='<div class="mini">niciun semnal</div>';return}
  var st=n(g('stp').value,0), lot=n(g('lot').value,0), cap=n(g('cap').value,0);
  var dir=sig.dir==='long'?1:-1;
  if(!st||!lot){g('sig').innerHTML='<div class="mini">pune stop și lot în Setări</div>';return}
  var sl=sig.entry-dir*st, t1=sig.entry+dir*st, t2=sig.entry+dir*2*st, r=lot*st;
  var h='<table class="sig">';
  h+='<tr><td>Direcție</td><td class="big" style="color:'+(dir>0?'#4ade80':'#f87171')+'">'+sig.dir.toUpperCase()+' '+sig.lv+'</td></tr>';
  h+='<tr><td>Intrare</td><td>'+sig.entry.toFixed(2)+'</td></tr>';
  h+='<tr><td>Stop</td><td>'+sl.toFixed(2)+' ('+st.toFixed(0)+' pt)</td></tr>';
  h+='<tr><td>Break-even</td><td>'+sig.entry.toFixed(2)+'</td></tr>';
  h+='<tr><td>1R</td><td>'+t1.toFixed(2)+'</td></tr>';
  h+='<tr><td>2R</td><td>'+t2.toFixed(2)+'</td></tr>';
  h+='<tr><td>Risc la lot '+lot+'</td><td>'+r.toFixed(2)+' $ ('+(r/cap*100).toFixed(2)+'%)</td></tr>';
  h+='</table>';
  if(sig.be)h+='<div class="warn">1R atins — stopul la break-even, jumătate închisă</div>';
  g('sig').innerHTML=h;
}

function closeSig(res){
  if(!sig){alert('niciun semnal');return}
  jr.unshift({d:sig.dir,lv:sig.lv,e:sig.entry,t:sig.t,res:res});
  if(res==='loss')strikes++; else strikes=0;
  sig=null; save(); renderJ(); paintSig(); lockBox();
}
function renderJ(){
  var w=jr.filter(function(x){return x.res==='win'}).length;
  g('stats').textContent=jr.length?' · '+(w/jr.length*100).toFixed(0)+'% reușită din '+jr.length:'';
  if(!jr.length){g('jr').innerHTML='<div class="mini">gol</div>';return}
  g('jr').innerHTML=jr.slice(0,40).map(function(x){
    return '<div class="jr" style="color:'+(x.res==='win'?'#4ade80':'#f87171')+'">'+
      new Date(x.t).toLocaleString('ro-RO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+
      ' · '+x.d+' '+x.lv+' @'+x.e.toFixed(2)+' · '+x.res+'</div>';
  }).join('');
}
function clearJ(){if(confirm('golești jurnalul?')){jr=[];strikes=0;save();renderJ();lockBox()}}

['key','cap','lot','stp'].forEach(function(id){g(id).onchange=function(){save();riskTxt();paintSig()}});
['pR2','pR1','pP','pS1','pS2'].forEach(function(id){g(id).onchange=function(){save();buildSel();paintLvls()}});

load();
setInterval(age,1000);
setInterval(paintBasis,20000);
try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
</script>
</body>
</html>
